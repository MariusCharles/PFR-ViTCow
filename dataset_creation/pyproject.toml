[project]
name = "pfr-vitcow-dataset"
version = "0.1.0"
description = "Dataset creation pipeline for PFR-ViTCow"
requires-python = ">=3.12"
dependencies = [
    # torch — if uv can't find these on PyPI, add the PyTorch index below
    "torch==2.9.1",
    "torchvision==0.24.1",
    "triton==3.5.1",

    # numpy pinned <2 for SAM3 compatibility
    "numpy>=1.26,<2",

    # vision
    "opencv-python==4.11.0.86",
    "pillow",
    "imageio",
    "scikit-image",
    "decord",

    # data / utils
    "pandas",
    "scikit-learn",
    "tqdm",
    "psutil",
    "pyyaml",
    "regex",

    # plotting
    "matplotlib",

    # hf / sam
    "huggingface_hub",
    "einops",
    "timm>=1.0.17",
    "pycocotools",
    "iopath",
    "safetensors",

    # local SAM3 package
    "sam3",
]

[tool.uv.sources]
sam3 = { path = "sam3", editable = true }

