<!doctype html>
<html>
  <head>
    <title>Video Annotation</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-image: url('{{ url_for("static", filename="background.jpg") }}');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .container {
        background-color: rgba(255, 255, 255, 0.85);
        padding: 20px;
        border-radius: 10px;
        display: flex;
        gap: 20px;
        align-items: flex-start; /* Align buttons with top of video */
      }

      .video-section {
        display: flex;
        flex-direction: column;
        align-items: flex-start; /* Align title to left of video */
        gap: 8px;
      }

      h2 {
        margin: 0;
        font-size: 18px; /* Smaller title */
        font-weight: normal;
      }

      video {
        border: 2px solid #333;
        border-radius: 8px;
      }

      .buttons {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      button {
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #4caf50;
        color: white;
        transition: background-color 0.2s;
      }

      button:hover {
        background-color: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="video-section">
        <h2>{{ video_name.replace('.mp4', '') }}</h2>

        <video width="640" controls>
          <source
            src="{{ url_for('static', filename='videos/h264/' + video_name) }}"
            type="video/mp4"
          />
        </video>
      </div>

      <form method="POST" action="/annotate" class="buttons">
        <input type="hidden" name="video_name" value="{{ video_name }}" />
        {% for behavior in behaviors %}
        <button type="submit" name="behavior" value="{{ behavior }}">
          {{ behavior }}
        </button>
        {% endfor %}
      </form>
    </div>
  </body>
</html>
